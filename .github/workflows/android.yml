name: Android CI / Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Thay đổi lệnh để làm sạch và build mới hoàn toàn
    - name: Clean and Build Debug APK
      run: ./gradlew clean assembleDebug

    # Tự động tìm kiếm file .apk trong toàn bộ thư mục build để tránh sai đường dẫn
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LCN-SmsSync-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/*/*.apk
