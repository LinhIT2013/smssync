name: Android CI / Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Lấy mã nguồn từ kho lưu trữ
    - uses: actions/checkout@v4

    # Bước 2: Thiết lập JDK 17 (Bắt buộc cho Android SDK mới)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Bước 3: Cấp quyền thực thi cho file chạy Gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Bước 4: Chỉ biên dịch ra file APK Debug (Nhanh và chính xác)
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # Bước 5: Đưa file APK lên mục Artifacts để bạn tải về máy
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LCN-SmsSync-APK
        path: app/build/outputs/apk/debug/app-debug.apk
