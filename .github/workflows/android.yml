name: Android CI / Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # TỰ ĐỘNG VÁ LỖI: Xóa file rỗng lỗi và tự cài đặt bộ chạy Gradle chuẩn của Google
    - name: Validate and Fix Gradle Wrapper
      run: |
        rm -f gradlew
        gradle wrapper --gradle-version 8.2 --distribution-type bin
        chmod +x gradlew

    # Tiến hành làm sạch dự án và biên dịch
    - name: Clean and Build Debug APK
      run: ./gradlew clean assembleDebug

    # Quét tất cả các thư mục để tìm file APK sau khi build xong
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LCN-SmsSync-APK
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/*/*.apk
